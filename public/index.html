<!doctype html><html><head><meta charset="utf-8"><title>GenUX Lecture Suite</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;background:#f7f8fb;color:#172033}.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}button,select{padding:.6rem;border:1px solid #ccd3e0;border-radius:8px;background:white}.panel{background:white;border:1px solid #dde3ee;border-radius:12px;padding:1rem;margin:1rem 0}.stack{display:flex;gap:1rem;flex-wrap:wrap}.metric{padding:1rem;background:#eef4ff;border-radius:8px;min-width:110px}.metric strong{display:block;font-size:1.5rem}pre{white-space:pre-wrap;background:#101827;color:#d8e3f5;padding:1rem;border-radius:8px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:.5rem;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>GenUX Lecture Suite</h1><p>Interactive, offline-safe demonstrations of protocols and UX generation modes.</p><div class="toolbar"><select id="topic"><option>a2ui</option><option>agui</option><option>mcp-apps</option><option>json-render</option><option>openui</option><option>harness</option></select><select id="mode"><option value="static">static</option><option value="declarative">declarative</option><option value="openEnded">open-ended</option><option value="mixed" selected>mixed</option></select><button id="run">Run example</button></div><div class="panel"><h2>Rendered UI</h2><div id="render"></div></div><div class="panel"><h2>Protocol payload / execution plan</h2><pre id="payload"></pre></div><script>const $=id=>document.getElementById(id);async function run(){let r=await fetch(`/api/example?topic=${$('topic').value}&mode=${$('mode').value}`);let d=await r.json();$('render').innerHTML=d.html;$('payload').textContent=JSON.stringify(d.protocol,null,2)}$('run').onclick=run;run()</script></body></html>
